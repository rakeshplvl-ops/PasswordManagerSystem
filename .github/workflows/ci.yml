name: PasswordManager CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PasswordManager.sln

      - name: Build solution (Release)
        run: dotnet build PasswordManager.sln -c Release --no-restore

      - name: Run automated tests (Domain, Application, Integration)
        run: dotnet test PasswordManager.sln -c Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend Build & Test (Node 24 + Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/password-manager-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/password-manager-web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & cryptographic tests (Vitest)
        run: npm test

      - name: Build production bundle (TypeScript & Vite)
        run: npm run build

  docker-verification:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build
