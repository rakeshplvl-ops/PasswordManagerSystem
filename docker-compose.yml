services:
  postgres:
    image: postgres:17-alpine
    container_name: passwordmanager-db
    environment:
      POSTGRES_DB: passwordmanager_db
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password_dev_secret_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_user -d passwordmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
