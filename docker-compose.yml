services:
  postgres:
    image: postgres:17-alpine
    container_name: passwordmanager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passwordmanager_db}
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm_password_dev_secret_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm_user} -d ${POSTGRES_DB:-passwordmanager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pm-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: passwordmanager-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-passwordmanager_db};Username=${POSTGRES_USER:-pm_user};Password=${POSTGRES_PASSWORD:-pm_password_dev_secret_change_in_prod}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - pm-network

  web:
    build:
      context: ./frontend/password-manager-web
      dockerfile: Dockerfile
    container_name: passwordmanager-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - pm-network

volumes:
  postgres_data:
    driver: local

networks:
  pm-network:
    driver: bridge
